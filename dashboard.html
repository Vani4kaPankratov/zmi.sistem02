<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Мій акаунт</title>
    <style>
        body {
            background: #0f172a;
            color: #e2e8f0;
            font-family: "Segoe UI", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            background: #1e293b;
            padding: 30px 50px;
            border-radius: 16px;
            box-shadow: 0 0 20px rgba(0,0,0,0.4);
            text-align: center;
        }
        h1 {
            color: #38bdf8;
        }
        a {
            color: #60a5fa;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>Вітаємо, {{ user.first_name }} {{ user.last_name }}!</h1>
        <p>Ви успішно увійшли в систему ✅</p>
        <a href="/login">← Вийти</a>
    </div>
</body>
</html>
